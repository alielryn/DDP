<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-image: url('https://pbs.twimg.com/media/FlHbOqOaEAERQsY?format=jpg&name=small');">
    <style>
        .box {
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 20px;
        }
    </style>
    <!--Ini Singkatan. Yang nantinya di text lengkap bakal muncul ketika kursor mengarah ke teks singkatan tadi.-->
    <p>
        The <abbr title="Barcelona Football Club">Barca</abbr> is a popular football club based in Barcelona, Spain.
    </p>
    <!--Ini Blockquote-->
    <p class="box">
        Ini Contoh Blockquote
        <blockquote cite="https://instagram.com/yoasei">
            "I breathe without an eternity"
        </blockquote>
        <!--Nah ini buat quote-->
        <q cite="https://instagram.com/yoasei">
            "I breathe without an eternity"
        </q>

        <iframe src="https://www.instagram.com/yoasei/" width="360" style="border: 1px">

        </iframe>
    </p>
</body>
</html>
